<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>shish (wasm)</title>
<style>
  body { font-family: monospace; max-width: 900px; margin: 2em auto; }
  textarea { width: 100%; height: 6em; font-family: monospace; }
  pre { background: #111; color: #ddd; padding: 1em; min-height: 8em; white-space: pre-wrap; }
  button { padding: 0.4em 1.2em; margin-top: 0.5em; }
</style>
</head>
<body>
  <h1>shish</h1>
  <p>Runs a script through shish (compiled to WebAssembly) as <code>shish -c "&lt;script&gt;"</code>.
     Non-interactive: stdin is not connected, so anything reading input will just see EOF.</p>

  <textarea id="script">echo hello from shish; for i in 1 2 3; do echo "i=$i"; done</textarea>
  <br>
  <button id="run" disabled>loading shish.wasm...</button>

  <h3>output</h3>
  <pre id="output"></pre>

  <script>
    var outputEl = document.getElementById('output');
    var runBtn = document.getElementById('run');
    var scriptEl = document.getElementById('script');

    function appendOutput(text) {
      outputEl.textContent += text + '\n';
    }

    // Module is read by shish.js (the Emscripten glue script) as it loads.
    var Module = {
      // no argv here -- callMain() below passes "-c <script>" per run
      print: appendOutput,
      printErr: appendOutput,
      onRuntimeInitialized: function() {
        runBtn.disabled = false;
        runBtn.textContent = 'run';
      }
    };

    runBtn.addEventListener('click', function() {
      outputEl.textContent = '';
      try {
        // exit(status) inside main() throws to unwind the wasm call
        // stack back to JS; that's expected, not a real error.
        Module.callMain(['-c', scriptEl.value]);
      } catch(e) {
        if(!(e && e.name === 'ExitStatus'))
          appendOutput('[js error] ' + e);
      }
    });
  </script>

  <!-- generated by cfg-emscripten (build/emscripten/shish.js + shish.wasm),
       copied next to this page -->
  <script src="shish.js"></script>
</body>
</html>
